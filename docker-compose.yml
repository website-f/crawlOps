name: crawlops

services:
  postgres:
    image: pgvector/pgvector:pg16   # postgres 16 + pgvector for semantic search
    restart: unless-stopped
    shm_size: "256mb"
    # sized for a shared host: generous cache, bounded per-query memory
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE:-2GB}
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_compression=on
      -c max_connections=150
    environment:
      POSTGRES_USER: crawlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawlops_dev}
      POSTGRES_DB: crawlops
    volumes:
      # pgdata16 (not pgdata): the pgvector image is Debian/glibc while the old
      # alpine one was musl, and the two sort text differently — reusing the musl
      # cluster would leave every text index built under the wrong collation.
      # Migration is dump -> fresh volume -> restore; the old `pgdata` volume is
      # deliberately left behind untouched as an instant rollback.
      - pgdata16:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawlops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-crawlops_meili_dev_key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MEILI_PORT:-8403}:7700"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 media cache. MinIO stopped publishing free images (Docker Hub + quay both
  # refuse pulls), so this is RustFS, an S3/MinIO-API compatible server. The service
  # keeps the name "minio" so MINIO_URL / MINIO_ROOT_* keep working unchanged.
  minio:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-crawlops}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-crawlops_dev_secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    user: root  # RustFS needs to own /data + /logs on the named volumes
    volumes:
      - miniodata:/data
      - miniologs:/logs
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-8404}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # LiteLLM removed — AI rotation is now our own DB-driven gateway (Settings → AI Engine).
  # Provider keys are stored encrypted in Postgres, not in env.

  backend-api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file: [.env]
    environment:
      SERVICE_ROLE: api
    # schema/seed runs per worker under a Postgres advisory lock, so N workers are safe
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips=*
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8401}:8000"

  backend-worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: [.env]
    environment:
      SERVICE_ROLE: worker
    command: python -m worker.main

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      # the only port a reverse proxy needs; keep it on loopback behind one
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-8400}:80"

  # ---- optional profiles ----

  camofox:
    build:
      # pinned: upstream HEAD (v1.17.0) runs `npm ci` before copying postinstall.js and fails to build
      context: https://github.com/jo-inc/camofox-browser.git#v1.16.0
    restart: unless-stopped
    environment:
      CAMOFOX_ACCESS_KEY: ${CAMOFOX_ACCESS_KEY:-}
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-crawlops_camofox_cookiekey}
      PROXY_STRATEGY: ${PROXY_STRATEGY:-}
      PROXY_BACKCONNECT_HOST: ${PROXY_BACKCONNECT_HOST:-}
      PROXY_BACKCONNECT_PORT: ${PROXY_BACKCONNECT_PORT:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
    volumes:
      - camofox_cookies:/home/node/.camofox/cookies
    expose:
      - "9377"

  loginsvc:
    build: ./loginsvc
    restart: unless-stopped
    shm_size: "1gb"
    expose:
      - "8500"

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "1200"

  # Self-serve BI / "data visual management": drag-drop dashboards on the CrawlOps
  # data. In Metabase, add a Postgres data source → host: postgres, db: crawlops,
  # user/pass from .env. Uses its own embedded app db (H2) on a volume.
  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    volumes:
      - metabasedata:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${METABASE_PORT:-8405}:3000"

  # ---- opt-in big-data profile (start with: docker compose --profile bigdata up -d) ----
  # ClickHouse: columnar OLAP for 100M+ rows. Mirror posts here for heavy analytics.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ["bigdata"]
    restart: unless-stopped
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-crawlops}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-crawlops_dev}
    volumes:
      - clickhousedata:/var/lib/clickhouse
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CLICKHOUSE_PORT:-8123}:8123"

  # Qdrant: vector DB for semantic search / RAG over post embeddings.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["bigdata"]
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"

volumes:
  pgdata16:
  pgdata:      # legacy musl cluster, kept as the rollback for the pgvector migration
  redisdata:
  meilidata:
  miniodata:
  miniologs:
  camofox_cookies:
  metabasedata:
  clickhousedata:
  qdrantdata:
