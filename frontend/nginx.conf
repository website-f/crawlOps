server {
    listen 80;
    client_max_body_size 20m;
    server_tokens off;

    # --- security headers (server-level: applies to /api/ and any location that does
    #     not set its own add_header; locations with add_header repeat the key ones) ---
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml application/manifest+json;

    # docker embedded DNS + variable upstream: re-resolve backend-api on each
    # request so a backend restart (new container IP) can't wedge nginx into 502s
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend-api:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;  # AI calls on reasoning models can run minutes
    }

    root /usr/share/nginx/html;
    index index.html;

    # vite emits content-hashed filenames, so these never change in place
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # the SPA shell must revalidate, or users keep a stale bundle after a deploy.
    # This block sets its own add_header, so the server-level security headers are
    # repeated here + the CSP that contains XSS/token-theft on the app document.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
