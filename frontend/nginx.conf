server {
    listen 80;
    client_max_body_size 20m;

    # docker embedded DNS + variable upstream: re-resolve backend-api on each
    # request so a backend restart (new container IP) can't wedge nginx into 502s
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend-api:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
